<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register | Scholar EasyPay</title>
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <a class="brand" href="index.html"
          ><span class="brand-mark">KB</span
          ><span>Scholar EasyPay<small>Fee management portal</small></span></a
        >
        <h1>Create your account</h1>
        <p class="muted">Set up a secure student fee portal account.</p>
        <form action="dashboard.html">
          <div class="form-grid">
            <div class="form-group full">
              <label for="name">Full name</label
              ><input
                id="name"
                type="text"
                placeholder="Student full name"
                required
              />
            </div>
            <div class="form-group">
              <label for="student-id">Student ID</label
              ><input
                id="student-id"
                name="student-id"
                type="text"
                placeholder="STU-2026-0142"
                required
              />
            </div>
            <div class="form-group">
              <label for="class">Class</label
              ><input id="class" type="text" placeholder="USS" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label
              ><input
                id="email"
                type="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="phone">Phone number</label
              ><input
                id="phone"
                type="tel"
                placeholder="+237 6xx xxx xxx"
                required
              />
            </div>
            <div class="form-group">
              <label for="new-password">Password</label
              ><input id="new-password" type="password" required />
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm password</label
              ><input id="confirm-password" type="password" required />
            </div>
          </div>
          <button
            class="btn btn-primary"
            type="submit"
            style="margin-top: 24px"
          >
            Register account
          </button>
        </form>
        <p class="auth-switch">
          Already registered?
          <a href="login.html" style="color: var(--primary); font-weight: 700"
            >Log in</a
          >
        </p>
      </section>
    </main>
  </body>
</html>
